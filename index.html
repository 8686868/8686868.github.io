<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Geoweb App</title>

        <!-- STYLESHEETS -->
        <!-- Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>

        <!-- Paho js library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"type="text/javascript"></script>

        <link rel="stylesheet" href="style.css">

        <!-- SCRIPTS -->
        <!-- Leaflet -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

        <script src="script.js"></script>
    </head>
    <body>

        <h1 id="title">Geoweb Application</h1>

        <div id="map"></div>

        <div id="controls">
            <input id="host" placeholder="Broker host" value="test.mosquitto.org">
            <input id="port" placeholder="Port" value="8081">
            <input id="topic" placeholder="Topic" value="ENGO551/your_name/my_temperature">

            <button id="start">start</button>
            <button id="end" disabled>end</button>
            <button id="share" disabled>share my status</button>
        </div>

        <p id="status"></p>

    </body>
</html>
